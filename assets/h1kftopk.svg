<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon A — "The Mark"
       The mark exactly as specified in the brand book (Logo, 05 of 06): a capital B
       beneath the shirorekha, with a haldi candlestick standing beside it. -->
  <rect width="32" height="32" rx="7" fill="#0E0F12"/>
  <!-- shirorekha — the head-stroke. Never removed. -->
  <rect x="6" y="6.2" width="20" height="2.4" fill="#F4EFE6"/>
  <!-- capital B, counters kept generous so they survive 16px -->
  <path fill="#F4EFE6" fill-rule="evenodd" d="M7.4 10.4h6.3c2.9 0 4.5 1.7 4.5 4 0 1.6-.8 2.8-2.1 3.3 1.6.5 2.6 1.8 2.6 3.7 0 2.8-1.9 4.5-5.1 4.5H7.4Zm3.2 2.5v3.5h2.7c1.2 0 1.9-.7 1.9-1.8s-.7-1.7-1.9-1.7Zm0 5.8v4h2.9c1.4 0 2.1-.7 2.1-2s-.7-2-2.1-2Z"/>
  <!-- haldi candle: wick behind, body in front -->
  <rect x="22.6" y="10.2" width="1.4" height="15.6" fill="#E8B22A"/>
  <rect x="21" y="13.4" width="4.6" height="9.2" rx="0.6" fill="#E8B22A"/>
</svg>
