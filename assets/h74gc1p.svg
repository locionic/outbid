<!-- Nabolader Favicon SVG -->
<!-- Simplified version optimized for small sizes (16x16, 32x32) -->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#1F2937"/>
  
  <!-- Simplified EV plug icon -->
  <rect x="12" y="8" width="8" height="12" rx="3" ry="3" fill="#10B981"/>
  
  <!-- Charging pins (simplified) -->
  <rect x="13.5" y="10" width="1.5" height="4" fill="#FFFFFF"/>
  <rect x="15.5" y="10" width="1.5" height="4" fill="#FFFFFF"/>
  <rect x="17" y="10" width="1.5" height="4" fill="#FFFFFF"/>
  
  <!-- Lightning bolt accent -->
  <path d="M 20 12 L 22 12 L 18 20 L 20 16 L 18 16 L 20 12" fill="#3B82F6"/>
  
  <!-- Cable (very simplified) -->
  <path d="M 16 20 Q 16 22, 18 24 Q 14 24, 16 20" fill="#10B981"/>
</svg>