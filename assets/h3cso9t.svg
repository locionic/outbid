<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Same mark as components/Logo.tsx: the board's width taper, four tiers.
       Given a solid ground here because a browser tab may be light or dark and
       a favicon cannot adapt. -->
  <rect width="32" height="32" rx="7" fill="#2B2740"/>
  <rect x="6"  y="6"    width="20" height="4" rx="2" fill="#FF6FA3"/>
  <rect x="6"  y="12.5" width="16" height="4" rx="2" fill="#9B7CF6"/>
  <rect x="6"  y="19"   width="12" height="4" rx="2" fill="#FF9F45"/>
  <rect x="6"  y="25.5" width="8"  height="4" rx="2" fill="#2ECC94"/>
</svg>
